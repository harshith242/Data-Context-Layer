[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxlayer"
version = "0.1.0"
description = "Context layer: builds reviewable context (semantic views, entity catalog, events, knowledge graph, drivers of measure moves) from a database, for any agent."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "pandas>=2.2",
    "numpy>=2",
    "pyyaml>=6",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "fastembed>=0.8",
    "sqlglot>=25",
    "pyarrow>=16",
    "pytz",
    "rapidfuzz>=3",
    "networkx>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctx = "ctxlayer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "examples"]
markers = [
    "live: needs a running Ollama server",
    "slow: slow test (model download, large data)",
]
addopts = "-m 'not live and not slow' --import-mode=importlib"
